[package]
name = "dungeon-app"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy_ecs = "0.16"
crossterm = "0.29.0"
ratatui = "0.30.2"
# ⚠️ 旧 `dungeon-*` crate 只被**遗留代码**需要：`src/lib.rs` 仍声明
# `pub mod keymap` / `pub mod throw`，而这两个模块用的是旧领域模型。
# `main.rs`（新装配层）不用它们，但 `cargo test -p dungeon-app` 会编译 `lib.rs`，
# 所以现在还不能从这张表里删——删了连 lib 测试目标都编不过。
# **触发条件：** R5 清理 `src/lib.rs` 的 keymap/throw 与 `src/pages/` 孤儿目录后，
# 这四行与本包脱离，那时一并删除。
dungeon-core = { path = "dungeon-core" }
dungeon-action = { path = "dungeon-action" }
dungeon-world = { path = "dungeon-world" }
dungeon-render = { path = "dungeon-render" }
ecs_core = { path = "ecs_core" }
presentation = { path = "presentation" }
render-api = { workspace = true }
utils = { path = "utils" }
sys = { path = "sys" }
tui = { path = "tui" }
bincode = "1.3"
log = "0.4"

[dev-dependencies]
# 集成测试直接操作 `ecs_core` 的世界，需要与 `ecs_core` 同一份 bevy_ecs 类型
# （`World` / `Entity` / `With` 等来自 ECS，不由 `ecs_core` 重新导出）。
bevy_ecs = { workspace = true }

[workspace]
members = [
    "dungeon-core",
    "dungeon-action",
    "dungeon-world",
    "dungeon-render",
    "terrain-forge",
    "ecs_core",
    "presentation",
    "render-api",
    "utils",
    "sys",
    "tui",
]

[workspace.dependencies]
log = "0.4"
bevy_ecs = "0.16"
render-api = { path = "render-api" }