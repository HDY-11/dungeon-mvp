[package]
name = "dungeon-app"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy_ecs = { workspace = true }
crossterm = "0.29.0"
ratatui = "0.30.2"
# 旧 `dungeon-*` crate 已归档到 `archive/`（R5，见 archive/README.md）：
# 新装配层只用下面这几个 crate，`src/lib.rs` 只声明 `pub mod keys`。
ecs_core = { path = "ecs_core" }
presentation = { path = "presentation" }
render-api = { workspace = true }
sys = { path = "sys" }
tui = { path = "tui" }
bincode = "1.3"
# 存档投影的序列化 derive（`src/save.rs`，DsnE19）；workspace 里 `ecs_core` 已用 serde，
# 此处只是把它接到根 crate——不引入新的传递依赖。
serde = { version = "1", features = ["derive"] }
log = "0.4"

[dev-dependencies]
# 集成测试直接操作 `ecs_core` 的世界，需要与 `ecs_core` 同一份 bevy_ecs 类型
# （`World` / `Entity` / `With` 等来自 ECS，不由 `ecs_core` 重新导出）。
bevy_ecs = { workspace = true }

[workspace]
members = [
    "terrain-forge",
    "ecs_core",
    "presentation",
    "render-api",
    "utils",
    "sys",
    "tui",
# 已归档的旧架构（R5，见 archive/README.md）**不再列入 workspace members**：
# 新代码零依赖，移出后 `cargo test --workspace` 不再编译/测试它们（省编译时间）。
# 需要回查历史实现时，可在 `archive/<crate>` 下单独 `cargo test`（各自 pin bevy_ecs 0.16）。
]

[workspace.dependencies]
log = "0.4"
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std"] }
render-api = { path = "render-api" }