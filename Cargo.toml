[package]
name = "dungeon-app"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy_ecs = "0.16"
crossterm = "0.29.0"
ratatui = "0.30.2"
dungeon-core = { path = "dungeon-core" }
dungeon-action = { path = "dungeon-action" }
dungeon-world = { path = "dungeon-world" }
dungeon-render = { path = "dungeon-render" }
core = { path = "core" }
utils = { path = "utils" }
sys = { path = "sys" }
tui = { path = "tui" }
bincode = "1.3"
log = "0.4"

[dev-dependencies]
# 集成测试直接操作 `core` 的世界，需要与 `core` 同一份 bevy_ecs 类型
# （`World` / `Entity` / `With` 等来自 ECS，不由 `core` 重新导出）。
bevy_ecs = { workspace = true }

[workspace]
members = [
    "dungeon-core",
    "dungeon-action",
    "dungeon-world",
    "dungeon-render",
    "terrain-forge",
    "core",
    "render-api",
    "utils",
    "sys",
    "tui",
]

[workspace.dependencies]
log = "0.4"
bevy_ecs = "0.16"
render-api = { path = "render-api" }