[package]
name = "dungeon-app"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy_ecs = "0.16"
crossterm = "0.29.0"
ratatui = "0.30.2"
# 旧 `dungeon-*` crate 已归档到 `archive/`（R5，见 archive/README.md）：
# 新装配层只用下面这几个 crate，`src/lib.rs` 只声明 `pub mod keys`。
ecs_core = { path = "ecs_core" }
presentation = { path = "presentation" }
render-api = { workspace = true }
utils = { path = "utils" }
sys = { path = "sys" }
tui = { path = "tui" }
bincode = "1.3"
log = "0.4"

[dev-dependencies]
# 集成测试直接操作 `ecs_core` 的世界，需要与 `ecs_core` 同一份 bevy_ecs 类型
# （`World` / `Entity` / `With` 等来自 ECS，不由 `ecs_core` 重新导出）。
bevy_ecs = { workspace = true }

[workspace]
members = [
    "terrain-forge",
    "ecs_core",
    "presentation",
    "render-api",
    "utils",
    "sys",
    "tui",
    # 已归档的旧架构（R5，见 archive/README.md）：**保留为 members 只为让它们仍可编译/可测**，
    # 随时能回查历史实现；新代码零依赖。彻底不用时可把下面 4 行连同 `archive/` 一起删掉。
    "archive/dungeon-core",
    "archive/dungeon-action",
    "archive/dungeon-world",
    "archive/dungeon-render",
]

[workspace.dependencies]
log = "0.4"
bevy_ecs = "0.16"
render-api = { path = "render-api" }